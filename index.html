<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Runway Archive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>👠 Runway Archive</h1>
    <p>Drag Race look database</p>
  </header>

  <section class="filters">

    <input id="searchBar" type="text" placeholder="Search looks..." />

    <select id="seasonFilter">
      <option value="all">All Seasons</option>
      <option value="1">Season 1</option>
      <option value="2">Season 2</option>
      <option value="15">Season 15</option>
    </select>

    <select id="queenFilter">
      <option value="all">All Queens</option>
      <option value="Sasha Colby">Sasha Colby</option>
      <option value="Jinkx Monsoon">Jinkx Monsoon</option>
      <option value="Symone">Symone</option>
    </select>

    <select id="episodeFilter">
      <option value="all">All Episodes</option>
      <option value="1">Episode 1</option>
      <option value="2">Episode 2</option>
      <option value="3">Episode 3</option>
    </select>

  </section>

  <main>
    <div id="grid" class="grid"></div>
  </main>

  <!-- MODAL -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <span id="closeModal" class="close">&times;</span>

      <img id="modalImg" />
      <h2 id="modalQueen"></h2>
      <p id="modalInfo"></p>
      <p id="modalRunway"></p>

      <button id="favBtn">❤️ Favorite</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
