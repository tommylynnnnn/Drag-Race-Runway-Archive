<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👠 Runway Archive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header>
    <h1>👠 Runway Archive</h1>
    <p>Drag Race look database</p>
  </header>

  <!-- FILTERS -->
  <section class="filters">

    <input
      id="searchBar"
      type="text"
      placeholder="Search looks (gown, latex, iconic...)"
    >

    <select id="seasonFilter">
      <option value="all">All Seasons</option>
      <option value="1">Season 1</option>
      <option value="2">Season 2</option>
      <option value="15">Season 15</option>
    </select>

    <select id="episodeFilter">
      <option value="all">All Episodes</option>
      <option value="0">Promo</option>
      <option value="1">Episode 1</option>
      <option value="2">Episode 2</option>
      <option value="3">Episode 3</option>
    </select>

  </section>

  <!-- TAG FILTERS -->
  <section id="tagBar" class="tag-bar"></section>

  <!-- LOOK GRID -->
  <main>

    <div id="grid" class="grid"></div>

    <!-- LOAD MORE BUTTON -->
    <div class="load-more-container">
      <button id="loadMoreBtn">
        Load More Looks
      </button>
    </div>

  </main>

  <!-- LOOK DETAILS MODAL -->
  <div id="modal" class="modal hidden">

    <div class="modal-content">

      <span id="closeModal" class="close">&times;</span>

      <img
        id="modalImg"
        src=""
        alt="Runway Look"
      >

      <h2 id="modalQueen"></h2>

      <p id="modalInfo"></p>

      <p id="modalRunway"></p>

      <button id="favBtn">
        ❤️ Favorite
      </button>

    </div>

  </div>

  <script src="game.js"></script>

</body>
</html>
